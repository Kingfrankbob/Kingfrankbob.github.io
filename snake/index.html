<!DOCTYPE html>
<html lang="en">

<head>
  <title>Snake Game</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../assets/css/site-refresh.css" />
  <script src="https://code.jquery.com/jquery-1.11.3.js"></script>
  <script src="../assets/js/site-refresh.js" defer></script>
  <style>
    .snake-page {
      min-height: 100vh;
      margin: 0;
      background: #080a0b;
    }

    .snake-shell {
      display: grid;
      min-height: 100vh;
      align-content: center;
      justify-items: center;
      gap: 1.25rem;
      padding: 1.5rem;
    }

    .snake-header {
      display: flex;
      width: min(100%, 560px);
      align-items: center;
      justify-content: space-between;
    }

    .snake-header a {
      color: #9ce267;
      text-decoration: none;
    }

    .snake-header h1 {
      margin: 0;
      font-size: 1.1rem;
    }

    .snake-scoreboard {
      display: flex;
      width: min(100%, 560px);
      justify-content: space-between;
      color: #a9b1ad;
    }

    .snake-scoreboard p {
      margin: 0;
    }

    .snake-scoreboard strong {
      margin-left: 0.4rem;
      color: #f4f5f2;
    }

    #game {
      width: min(72vw, 400px);
      height: auto;
      border: 1px solid #34443b;
      border-radius: 4px;
      background-color: #0c1110;
      image-rendering: pixelated;
    }

    #btn_stop {
      padding: 0.7rem 1rem;
      border: 1px solid #526147;
      border-radius: 4px;
      background: #151b17;
      color: #f4f5f2;
      cursor: pointer;
    }

    #end_msg {
      min-height: 1.5rem;
      margin: 0;
      color: #ffb15c;
    }

    @media (max-width: 560px) {
      .snake-shell {
        padding: 1rem;
      }

      #game {
        width: min(88vw, 400px);
      }
    }
  </style>
</head>

<body class="snake-page">
  <main class="snake-shell">
    <header class="snake-header">
      <h1>Snake</h1>
      <a href="../index.html">Back to Michael's site</a>
    </header>
    <div class="snake-scoreboard" aria-live="polite">
      <p>Score <strong id="score">0</strong></p>
      <p>Best <strong id="high">0</strong></p>
    </div>
    <canvas width="400" height="400" id="game" aria-label="Snake game board"></canvas>
    <button id="btn_stop" type="button">Stop game</button>
    <p id="end_msg" aria-live="polite"></p>
  </main>

  <script>
    var canvas = document.getElementById("game");
    var context = canvas.getContext("2d");
    var grid = 16;
    var count = 0;
    var score = 0;
    //reading  last score value
    if (localStorage.score) {
      document.getElementById("score").innerHTML = localStorage.score;
    }

    var max = 0;

    var snake = {
      x: 160,
      y: 160,

      // snake velocity. moves one grid length every frame in either the x or y direction
      dx: grid,
      dy: 0,

      // keep track of all grids the snake body occupies
      cells: [],

      // length of the snake. grows when eating an apple
      maxCells: 4,
    };
    var apple = {
      x: 320,
    </main >
      y: 320,
    };

    // get random whole numbers in a specific range
    // @see https://stackoverflow.com/a/1527820/2124254
    function getRandomInt(min, max) {
      return Math.floor(Math.random() * (max - min)) + min;
    }

    // game loop
    function loop() {
      requestAnimationFrame(loop);
      // slow game loop to 15 fps instead of 60 (60/15 = 4)
      if (++count < 10) {
        return;
      }
      count = 0;
      context.clearRect(0, 0, canvas.width, canvas.height);
      // move snake by it's velocity
      snake.x += snake.dx;
      snake.y += snake.dy;
      // wrap snake position horizontally on edge of screen
      if (snake.x < 0) {
        snake.x = canvas.width - grid;
      } else if (snake.x >= canvas.width) {
        snake.x = 0;
      }

      // wrap snake position vertically on edge of screen
      if (snake.y < 0) {
        snake.y = canvas.height - grid;
      } else if (snake.y >= canvas.height) {
        snake.y = 0;
      }
      // keep track of where snake has been. front of the array is always the head
      snake.cells.unshift({ x: snake.x, y: snake.y });
      // remove cells as we move away from them
      if (snake.cells.length > snake.maxCells) {
        snake.cells.pop();
      }
      // draw apple
      context.fillStyle = "red";
      context.fillRect(apple.x, apple.y, grid - 1, grid - 1);
      // draw snake one cell at a time
      context.fillStyle = "green";
      snake.cells.forEach(function (cell, index) {
        // drawing 1 px smaller than the grid creates a grid effect in the snake body so you can see how long it is
        context.fillRect(cell.x, cell.y, grid - 1, grid - 1);
        // snake ate apple
        if (cell.x === apple.x && cell.y === apple.y) {
          snake.maxCells++;
          score += 1;
          //saving score for next playing.
          localStorage.setItem("score", score);
          //max=score;
          document.getElementById("score").innerHTML = score;

          // canvas is 400x400 which is 25x25 grids
          apple.x = getRandomInt(0, 25) * grid;
          apple.y = getRandomInt(0, 25) * grid;
        }
        // check collision with all cells after this one (modified bubble sort)
        for (var i = index + 1; i < snake.cells.length; i++) {
          // snake occupies same space as a body part. reset game
          if (cell.x === snake.cells[i].x && cell.y === snake.cells[i].y) {
            if (score > max) {
              max = score;
            }
            snake.x = 160;
            snake.y = 160;
            snake.cells = [];
            snake.maxCells = 4;
            snake.dx = grid;
            snake.dy = 0;
            //score=0;
            apple.x = getRandomInt(0, 25) * grid;
            apple.y = getRandomInt(0, 25) * grid;
            document.getElementById("high").innerHTML = max;
          }
        }
      });
    }
    // listen to keyboard events to move the snake
    document.addEventListener("keydown", function (e) {
      // prevent snake from backtracking on itself by checking that it's
      // not already moving on the same axis (pressing left while moving
      // left won't do anything, and pressing right while moving left
      // shouldn't let you collide with your own body)

      // left arrow key
      if (e.which === 37 && snake.dx === 0) {
        snake.dx = -grid;
        snake.dy = 0;
      }
      // up arrow key
      else if (e.which === 38 && snake.dy === 0) {
        snake.dy = -grid;
        snake.dx = 0;
      }
      // right arrow key
      else if (e.which === 39 && snake.dx === 0) {
        snake.dx = grid;
        snake.dy = 0;
      }
      // down arrow key
      else if (e.which === 40 && snake.dy === 0) {
        snake.dy = grid;
        snake.dx = 0;
      }
    });
    // start the game
    requestAnimationFrame(loop);

    function myFunction() {
      document.getElementById("end_msg").innerHTML = "";
      alert("Press Confirm to resume the game!");
    }

    //stop playing
    $(document).ready(function () {
      $("#btn_stop").click(function () {
        document.getElementById("end_msg").innerHTML =
          "Game stopped by player";
        setTimeout(myFunction, 1000);
      });
    });
  </script>
</body>

</html>
